<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Grand Azur Hotel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <a class="nav-logo" href="index.html">Grand <span>Azur</span></a>
  <div></div>
  <div><a href="index.html" class="btn btn-ghost btn-sm">← На главную</a></div>
</nav>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <h2>Grand Azur</h2>
      <p>Войдите в личный кабинет</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">Войти</div>
      <div class="auth-tab" onclick="switchTab('register')">Регистрация</div>
    </div>

    <!-- LOGIN -->
    <div class="auth-form active" id="tab-login">
      <div class="alert alert-info" style="font-size:.82rem;margin-bottom:1.2rem;">
        <b>Демо-аккаунты:</b><br>
        Администратор: admin@hotel.com / admin123<br>
        Клиент: diar@gmail.com / 1234567  
        Клиент: ivan@mail.ru / 123456
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <div id="loginError" style="color:#e74c3c;font-size:.85rem;margin-bottom:.8rem;display:none"></div>
      <button class="btn btn-gold btn-full" onclick="doLogin()">Войти</button>
    </div>

    <!-- REGISTER -->
    <div class="auth-form" id="tab-register">
      <div class="form-group">
        <label>Полное имя</label>
        <input type="text" id="regName" placeholder="Иван Петров">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="regPassword" placeholder="Минимум 6 символов">
      </div>
      <div class="form-group">
        <label>Повторите пароль</label>
        <input type="password" id="regPassword2" placeholder="••••••••">
      </div>
      <div id="regError" style="color:#e74c3c;font-size:.85rem;margin-bottom:.8rem;display:none"></div>
      <button class="btn btn-gold btn-full" onclick="doRegister()">Создать аккаунт</button>
    </div>

    <div class="auth-footer">
      Продолжая, вы соглашаетесь с <a href="#">условиями использования</a>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
// Redirect if already logged in
if (currentUser) {
  window.location.href = currentUser.role === 'admin' ? 'admin.html' : 'client.html';
}

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
  });
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}
function hideErr(id) { document.getElementById(id).style.display = 'none'; }

function doLogin() {
  hideErr('loginError');
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPassword').value;
  if (!email || !pass) { showErr('loginError', 'Заполните все поля'); return; }
  const user = login(email, pass);
  if (!user) { showErr('loginError', 'Неверный email или пароль'); return; }
  showToast('Добро пожаловать, ' + user.name + '!', 'success');
  setTimeout(() => {
    window.location.href = user.role === 'admin' ? 'admin.html' : 'client.html';
  }, 700);
}

function doRegister() {
  hideErr('regError');
  const name  = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass  = document.getElementById('regPassword').value;
  const pass2 = document.getElementById('regPassword2').value;
  if (!name || !email || !pass) { showErr('regError', 'Заполните все поля'); return; }
  if (pass.length < 6) { showErr('regError', 'Пароль минимум 6 символов'); return; }
  if (pass !== pass2)  { showErr('regError', 'Пароли не совпадают'); return; }
  const result = register(name, email, pass);
  if (result.error) { showErr('regError', result.error); return; }
  showToast('Аккаунт создан!', 'success');
  setTimeout(() => { window.location.href = 'client.html'; }, 700);
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('tab-login').classList.contains('active')) doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
